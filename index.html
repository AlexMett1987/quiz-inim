<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Previdia Compact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1f24;
  --panel:#e8e6e1;
  --ink:#1c1f24;
  --ink-soft:#5d6470;
  --line:#c3c0b8;
  --ok:#2f8f4e;
  --fault:#d9a400;
  --alarm:#c8352b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  font-family:"IBM Plex Sans",system-ui,sans-serif;
  color:var(--ink);
  line-height:1.5;
  display:flex;
  justify-content:center;
  padding:16px;
  min-height:100vh;
}
main{
  width:100%;
  max-width:560px;
  background:var(--panel);
  border-radius:6px;
  border:1px solid #9b978e;
  box-shadow:0 0 0 6px #2a2e35;
  overflow:hidden;
}
header{
  padding:18px 20px 14px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:flex-start;
  gap:12px;
}
header>.testata{flex:1;min-width:0}
#audio{
  width:auto;flex:none;align-self:center;
  padding:7px 11px;
  font-family:"IBM Plex Mono",monospace;font-size:.72rem;letter-spacing:.04em;
  background:transparent;color:var(--ink-soft);
}
#audio[aria-pressed="true"]{color:var(--ink);background:#f6f5f2;border-color:#8b8880}
.leds{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.led{width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.led.a{background:var(--alarm)}
.led.f{background:var(--fault)}
.led.o{background:var(--ok)}
h1{font-size:1.05rem;font-weight:600;margin:0;letter-spacing:.01em}
.sub{margin:2px 0 0;font-size:.82rem;color:var(--ink-soft)}
.body{padding:20px}
p.lead{margin:0 0 16px;font-size:.92rem;color:var(--ink-soft)}
button{
  font:inherit;
  cursor:pointer;
  border:1px solid var(--line);
  background:#f6f5f2;
  color:var(--ink);
  border-radius:4px;
  padding:12px 14px;
  width:100%;
  text-align:left;
}
button:hover:not(:disabled){border-color:#8b8880}
button:focus-visible{outline:2px solid #3a6ea5;outline-offset:2px}
.levels{display:flex;flex-direction:column;gap:10px}
.levels button{display:flex;flex-direction:column;gap:2px}
.levels b{font-weight:600}
.levels span{font-size:.82rem;color:var(--ink-soft)}
.meter{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:.78rem;
  color:var(--ink-soft);margin-bottom:14px;
}
.bar{height:3px;background:var(--line);margin:-8px 0 16px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink-soft);transition:width .25s}
h2{font-size:1.02rem;font-weight:500;margin:0 0 16px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button:disabled{cursor:default;opacity:1}
.opts button.right{border-color:var(--ok);background:#e6f2e9;box-shadow:inset 3px 0 0 var(--ok)}
.opts button.wrong{border-color:var(--alarm);background:#f6e5e3;box-shadow:inset 3px 0 0 var(--alarm)}
.expl{
  margin:16px 0 0;padding:12px 14px;font-size:.88rem;
  background:#dedbd4;border-radius:4px;color:#33383f;
}
.next{margin-top:14px;text-align:center;font-weight:500}
.score{font-family:"IBM Plex Mono",monospace;font-size:2.6rem;margin:0 0 4px}
.err{color:var(--alarm)}
footer{padding:12px 20px;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div class="leds"><i class="led a"></i><i class="led f"></i><i class="led o"></i></div>
    <div class="testata">
      <h1 id="titolo">Quiz Previdia Compact</h1>
      <p class="sub" id="sottotitolo">Caricamento domande…</p>
    </div>
    <button id="audio" type="button" aria-pressed="true" title="Musica di accompagnamento">♪ on</button>
  </header>
  <div class="body" id="app"></div>
  <footer>Materiale di autoformazione interna. Verificare sempre sui manuali INIM in vigore.</footer>
</main>

<script>
/* ---------- Audio: tappeto musicale generato, nessun file esterno ---------- */
const Suono = (() => {
  const SCALA = [0, 3, 5, 7, 10];          // pentatonica minore: neutra, non stucchevole
  const BASE = 220;                        // La3
  let ctx = null, master = null, timer = null;
  let voluto = true;                       // acceso di default: parte al primo tocco

  const hz = semi => BASE * Math.pow(2, semi / 12);

  function avviaCtx(){
    if(ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    return true;
  }

  // Una nota di pad: due oscillatori lievemente scordati dentro un filtro passa-basso
  function pad(semi, durata){
    const t = ctx.currentTime;
    const g = ctx.createGain();
    const f = ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 900;
    f.Q.value = 0.6;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + durata * 0.35);   // attacco lento
    g.gain.linearRampToValueAtTime(0, t + durata);
    f.connect(g); g.connect(master);
    [0, 4].forEach(scordatura => {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = hz(semi);
      o.detune.value = scordatura;
      o.connect(f);
      o.start(t);
      o.stop(t + durata + 0.1);
    });
  }

  function ciclo(){
    const semi = SCALA[Math.floor(Math.random() * SCALA.length)]
               + 12 * Math.floor(Math.random() * 2);
    pad(semi, 5.5);
    pad(semi - 12, 7);                                          // basso di sostegno
    timer = setTimeout(ciclo, 3800 + Math.random() * 1600);      // nessun loop percepibile
  }

  // Segnale breve per la risposta, indipendente dal tappeto
  function nota(semi, durata, tipo){
    if(!voluto || !ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    const o = ctx.createOscillator();
    o.type = tipo;
    o.frequency.value = hz(semi);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + durata);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + durata + 0.02);
  }

  // Applica lo stato voluto. Richiede un gesto dell'utente già avvenuto:
  // i browser bloccano qualsiasi audio avviato senza interazione.
  function applica(){
    if(!avviaCtx()) return null;                               // Web Audio non disponibile
    if(voluto){
      ctx.resume();
      master.gain.setTargetAtTime(0.5, ctx.currentTime, 1.2);  // dissolvenza in entrata
      if(!timer) ciclo();
    } else {
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.6);
      clearTimeout(timer); timer = null;
    }
    return voluto;
  }

  return {
    get attivo(){ return voluto; },
    get disponibile(){ return !!(window.AudioContext || window.webkitAudioContext); },
    sblocca(){ if(voluto) applica(); },     // primo gesto qualunque sulla pagina
    commuta(){ voluto = !voluto; return applica(); },
    giusto(){ nota(12, 0.16, 'sine'); setTimeout(() => nota(19, 0.22, 'sine'), 110); },
    sbagliato(){ nota(-5, 0.3, 'sawtooth'); },
    fine(pct){
      if(pct < 50) return nota(-7, 0.5, 'sine');
      [0, 7, 12, 16].forEach((s, i) => setTimeout(() => nota(s, 0.3, 'sine'), i * 130));
    }
  };
})();

const btnAudio = document.getElementById('audio');

function etichettaAudio(on){
  btnAudio.setAttribute('aria-pressed', String(on));
  btnAudio.textContent = on ? '♪ on' : '♪ off';
}

if(!Suono.disponibile){
  btnAudio.textContent = 'n/d';
  btnAudio.disabled = true;
} else {
  etichettaAudio(Suono.attivo);
  btnAudio.addEventListener('click', () => etichettaAudio(Suono.commuta()));
  // L'audio parte al primo gesto dell'utente, requisito di tutti i browser.
  // Il pulsante è escluso: ci pensa già il suo gestore di click.
  let sbloccato = false;
  const sblocca = ev => {
    if(sbloccato || btnAudio.contains(ev.target)) return;
    sbloccato = true;
    Suono.sblocca();
    ['pointerdown', 'keydown'].forEach(e => document.removeEventListener(e, sblocca));
  };
  ['pointerdown', 'keydown'].forEach(e => document.addEventListener(e, sblocca));
}

/* ---------- Quiz ---------- */
const app = document.getElementById('app');
let dati = null, domande = [], indice = 0, punti = 0;

fetch('domande.json')
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    dati = d;
    document.getElementById('titolo').textContent = 'Quiz ' + d.dispositivo;
    document.getElementById('sottotitolo').textContent = d.sottotitolo;
    schermataLivelli();
  })
  .catch(() => {
    app.innerHTML = '<p class="lead err">Domande non caricate. Il file domande.json deve trovarsi nella stessa cartella di index.html e la pagina va aperta da un server web, non da file locale.</p>';
  });

function schermataLivelli(){
  const chiavi = Object.keys(dati.livelli);
  app.innerHTML = '<p class="lead">Scegli il livello di difficoltà.</p><div class="levels"></div>';
  const box = app.querySelector('.levels');
  chiavi.forEach(k => {
    const l = dati.livelli[k];
    const b = document.createElement('button');
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = l.etichetta;
    b.querySelector('span').textContent = l.descrizione + ' · ' + l.domande.length + ' domande';
    b.onclick = () => avvia(k);
    box.appendChild(b);
  });
}

function avvia(chiave){
  domande = dati.livelli[chiave].domande.slice();
  indice = 0; punti = 0;
  mostraDomanda();
}

function mostraDomanda(){
  const d = domande[indice];
  app.innerHTML =
    '<div class="meter"><span>Domanda ' + (indice+1) + ' di ' + domande.length + '</span><span>' + punti + ' corrette</span></div>' +
    '<div class="bar"><i style="width:' + (indice/domande.length*100) + '%"></i></div>' +
    '<h2></h2><div class="opts"></div>';
  app.querySelector('h2').textContent = d.q;
  const box = app.querySelector('.opts');
  d.opzioni.forEach((testo, i) => {
    const b = document.createElement('button');
    b.textContent = testo;
    b.onclick = () => rispondi(i, box, d);
    box.appendChild(b);
  });
}

function rispondi(scelta, box, d){
  const bottoni = [...box.children];
  bottoni.forEach((b,i) => {
    b.disabled = true;
    if(i === d.corretta) b.classList.add('right');
    else if(i === scelta) b.classList.add('wrong');
  });
  if(scelta === d.corretta){ punti++; Suono.giusto(); } else Suono.sbagliato();
  const e = document.createElement('p');
  e.className = 'expl';
  e.textContent = d.spiegazione;
  app.appendChild(e);
  const n = document.createElement('button');
  n.className = 'next';
  n.textContent = indice < domande.length - 1 ? 'Domanda successiva' : 'Vedi risultato';
  n.onclick = () => { indice++; indice < domande.length ? mostraDomanda() : risultato(); };
  app.appendChild(n);
  n.focus();
}

function risultato(){
  const pct = Math.round(punti / domande.length * 100);
  const esito = pct >= 80 ? 'Preparazione solida.' : pct >= 50 ? 'Rivedi i punti sbagliati sul manuale.' : 'Conviene rileggere il manuale prima di ripetere.';
  Suono.fine(pct);
  app.innerHTML = '<p class="score">' + punti + '/' + domande.length + '</p><p class="lead">' + esito + '</p>';
  const b = document.createElement('button');
  b.className = 'next';
  b.textContent = 'Torna ai livelli';
  b.onclick = schermataLivelli;
  app.appendChild(b);
}
</script>
</body>
</html>
